repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
        exclude: .lock

  # https://github.com/astral-sh/ruff-pre-commit
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.8
    hooks:
      - id: ruff-format
        name: ruff-format
        entry: uv run ruff format
        args: [--config, python-core/pyproject.toml]
      - id: ruff-check
        name: ruff-isort
        entry: uv run ruff check --select I
        args: [--config, python-core/pyproject.toml, --exit-non-zero-on-fix]
      - id: ruff-check
        name: ruff-lint
        entry: uv run ruff check --ignore I --unsafe-fixes
        args: [--config, python-core/pyproject.toml, --exit-non-zero-on-fix]

  # https://github.com/facebook/pyrefly-pre-commit
  - repo: https://github.com/facebook/pyrefly-pre-commit
    rev: 0.52.0
    hooks:
      - id: pyrefly-check
        name: pyrefly-check
        entry: uv run pyrefly check
        args: [--config, python-core/pyproject.toml]
        pass_filenames: false
