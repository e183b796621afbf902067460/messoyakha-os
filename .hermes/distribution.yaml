name: messoyakha-quant-ops
version: 1.0.0
description: "Autonomous QuantOps assistant."
hermes_requires: ">=0.21.0"
author: "e183b796621afbf902067460"
license: "MIT"

env_requires:
  - name: OPENROUTER_API_KEY
    description: "OpenRouter API key."
    default:
    required: true
  - name: ROUTERAI_API_KEY
    description: "RouterAI API key."
    default:
    required: true

  - name: OPENVIKING_ENDPOINT
    description: "OpenViking endpoint."
    default: http://0.0.0.0:1933
    required: true
  - name: OPENVIKING_API_KEY
    description: "OpenViking API key."
    default:
    required: true
  - name: OPENVIKING_ACCOUNT
    description: "OpenViking account."
    default: "default"
    required: true
  - name: OPENVIKING_USER
    description: "OpenViking user."
    default: "default"
    required: true
  - name: OPENVIKING_AGENT
    description: "OpenViking agent."
    default: "hermes"
    required: true
