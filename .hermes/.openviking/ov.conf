{
  "server": {
    "auth_mode": "trusted",
    "root_api_key": "${OPENVIKING_ROOT_API_KEY}",
    "host": "${OPENVIKING_SERVER_HOST}",
    "port": "${OPENVIKING_SERVER_PORT}",
    "profile_enabled": true,
    "agent_evolution": {
      "enabled": true
    }
  },
  "embedding": {
    "dense": {
      "provider": "openai",
      "api_base": "https://routerai.ru/api/v1",
      "model": "voyageai/voyage-4-lite",
      "dimension": 1024,
      "api_key": "${ROUTERAI_API_KEY}"
    },
    "circuit_breaker": {
      "failure_threshold": 3,
      "reset_timeout": 60,
      "max_reset_timeout": 300
    }
  },
  "vlm": {
    "provider": "openai",
    "api_base": "https://routerai.ru/api/v1",
    "model": "qwen/qwen3.7-flash",
    "api_key": "${ROUTERAI_API_KEY}",
    "media": {
      "enabled": true
    },
    "max_retries": 3,
    "timeout": 300
  },
  "rerank": {
    "provider": "openai",
    "api_base": "https://routerai.ru/api/v1",
    "model": "voyageai/rerank-2.5-lite",
    "api_key": "${ROUTERAI_API_KEY}",
    "threshold": 0.5,
    "timeout": 180
  },
  "storage": {
    "agfs": {
      "backend": "s3",
      "s3": {
        "region": "ru-1",
        "endpoint": "https://s3.twcstorage.ru",
        "bucket": "b769cd2e-fc03-41e7-8448-3af8183edcb2",
        "access_key": "${S3_ACCESS_KEY}",
        "secret_key": "${S3_SECRET_KEY}",
        "auto_detect_content_type": true
      },
      "timeout": 120
    }
  }
}
