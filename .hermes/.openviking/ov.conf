{
  "server": {
    "auth_mode": "trusted",
    "root_api_key": "${OPENVIKING_ROOT_API_KEY}",
    "host": "${OPENVIKING_SERVER_HOST}",
    "port": "${OPENVIKING_SERVER_PORT}"
  },
  "embedding": {
    "dense": {
      "provider": "openai",
      "api_base": "https://routerai.ru/api/v1",
      "model": "voyageai/voyage-4-lite",
      "dimension": 2048,
      "api_key": "${ROUTERAI_API_KEY}"
    }
  },
  "vlm": {
    "provider": "openai",
    "api_base": "https://routerai.ru/api/v1",
    "model": "openai/gpt-oss-20b",
    "api_key": "${ROUTERAI_API_KEY}"
  },
  "rerank": {
    "provider": "openai",
    "api_base": "https://routerai.ru/api/v1",
    "model": "voyageai/rerank-2.5-lite",
    "api_key": "${ROUTERAI_API_KEY}",
    "threshold": 0.5
  },
  "storage": {
    "backend": "s3fs",
    "endpoint": "https://s3.twcstorage.ru",
    "bucket": "f8e90488-f511555d-274b-4258-bffc-572dd1900382",
    "access_key": "${S3_ACCESS_KEY}",
    "secret_key": "${S3_SECRET_KEY}"
  },
  "code": {
    "summary_mode": "ast_llm"
  }
}
