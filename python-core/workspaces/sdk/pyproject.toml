[project]
name = "pep-sdk"
dynamic = ["version", "dependencies"]
description = "..."
readme = "README.md"
requires-python = ">=3.10,<4.0"

[project.urls]
cbr = "https://www.cbr.ru/development/dws/"
finam = "https://tradeapi.finam.ru/getting-started/"
fedstat-inflation-rate = "https://www.fedstat.ru/indicator/33568.do#"
fedstat-m2x = "https://fedstat.ru/indicator/59853"
smart-lab-sectors = "https://smart-lab.ru/forum/sectors/"

[build-system]
requires = ["hatchling", "uv-dynamic-versioning>=0.7.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
bump = true

[tool.uv]
package = true

[tool.hatch.metadata.hooks.uv-dynamic-versioning]
dependencies = [
    "babel>=2.18.0",

    "httpx[http2]>=0.28.1,<0.29",
    "suds-py3>=1.4.5.0",
    "crawlee[beautifulsoup,playwright]>=1.6.3",

    "duckdb>=1.5.2",
    "pyiceberg[pyiceberg-core,polars,pandas,s3fs]>=0.11.1",

    "lxml>=6.1.0",
    "xlrd>=2.0.2",

    "yfinance>=1.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["pep_sdk"]

[tool.hatch.build.targets.sdist]
exclude = ["tests"]
