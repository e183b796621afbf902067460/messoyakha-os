[project]
name = "pep-api"
dynamic = ["version", "dependencies"]
description = "..."
readme = "README.md"

requires-python = ">=3.10,<4.0"

[project.urls]
cbr = "https://www.cbr.ru/development/dws/"
cbrapi = "https://github.com/mbk-dev/cbrapi/tree/master"
okama = "https://habr.com/ru/companies/okama/profile/"

[build-system]
requires = ["hatchling", "uv-dynamic-versioning>=0.7.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
bump = true

[tool.uv]
package = true

[tool.hatch.metadata.hooks.uv-dynamic-versioning]
dependencies = [
    "attrs>=25.1.0,<26",
    "pydantic>=2.10.6,<3",
    "pandas>=2.2.3,<3",
    "polars==1.31.0",
    "numpy>=2.2.6",
    "httpx[http2]>=0.28.1,<0.29",
    "suds-py3>=1.4.5.0",
    "lxml>=6.1.0",
    "loguru>=0.7.3,<0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["pep_api"]

[tool.hatch.build.targets.sdist]
exclude = ["tests"]
