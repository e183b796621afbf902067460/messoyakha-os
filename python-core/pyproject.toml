[project]
name = "pep"
version = "0.0.1"
description = "Personal financial environment for more effective risk management in order to make optimal decisions in the face of uncertainty."
readme = "README.md"
license = { file = "LICENSE" }
dependencies = [
    "ruff==0.14.8",
    "pyrefly==0.52.0",
]
requires-python = ">=3.10,<4.0"

[project.urls]
source = "https://github.com/e183b796621afbf902067460/pep"
issues = "https://github.com/e183b796621afbf902067460/pep/issues"

[tool.uv]
package = false

# https://docs.astral.sh/uv/concepts/projects/workspaces/#workspace-sources
[tool.uv.sources]

# pipelines/
pep-pipelines = { workspace = true }

# strategies/*
pep-stock-duration = { workspace = true }

# workspaces/*
pep-api = { workspace = true }
pep-lakehouse = { workspace = true }

[tool.uv.workspace]
members = [
    "pipelines",
    "strategies/*",
    "workspaces/*",
]

[tool.ruff]
required-version = "0.14.8"
exclude = [".venv"]
line-length = 120
fix = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # https://docs.astral.sh/ruff/rules/any-type/
    "ANN002", "ANN003", "ANN401",

    # https://docs.astral.sh/ruff/rules/abstract-base-class-without-abstract-method/
    "B024",

    # https://docs.astral.sh/ruff/rules/missing-trailing-comma/
    "COM812",

    # https://docs.astral.sh/ruff/rules/#pydocstyle-d
    "D",

    # https://docs.astral.sh/ruff/rules/line-too-long/
    "E501",

    # https://docs.astral.sh/ruff/rules/f-string-in-exception/
    "EM101", "EM102",

    # https://docs.astral.sh/ruff/rules/commented-out-code/
    "ERA001",

    # https://docs.astral.sh/ruff/rules/#flake8-future-annotations-fa
    "FA",

    # https://docs.astral.sh/ruff/rules/#flake8-fixme-fix
    "FIX",

    # https://docs.astral.sh/ruff/rules/logging-f-string/
    "G004",

    # https://docs.astral.sh/ruff/rules/try-except-in-loop/
    "PERF203",

    # https://docs.astral.sh/ruff/rules/#refactor-plr
    "PLR0911", "PLR0912", "PLR0913", "PLR0915",

    # https://docs.astral.sh/ruff/rules/#ruff-specific-rules-ruf
    "RUF006",
    "RUF012",

    # https://docs.astral.sh/ruff/rules/#flake8-type-checking-tc
    "TC001", "TC002", "TC003",

    # https://docs.astral.sh/ruff/rules/missing-todo-author/
    "TD002", "TD003",

    # https://docs.astral.sh/ruff/rules/raise-vanilla-args/
    "TRY003",

    # https://docs.astral.sh/ruff/rules/redundant-open-modes/
    "UP015",

    # https://docs.astral.sh/ruff/rules/tab-indentation/
    "W191"
]

[tool.ruff.lint.isort]
lines-after-imports = 2
split-on-trailing-comma = false
combine-as-imports = true
force-wrap-aliases = true

# https://docs.astral.sh/ruff/settings/#lint_isort_section-order
section-order = ["future", "standard-library", "third-party", "workspace", "first-party", "local-folder"]

# https://docs.astral.sh/ruff/settings/#lint_isort_sections
sections = { "workspace" = ["pep_api", "pep_lakehouse"] }
known-first-party = ["pep_pipelines", "pep_stock_duration"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-builtins]
ignorelist = ["id", "open"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
indent-style = "space"
docstring-code-format = true
skip-magic-trailing-comma = false

[tool.pyrefly]
python-interpreter-path = ".venv/bin/python3.13"
python-platform = "linux"
search-path = ["pipelines", "strategies/stock-duration", "workspaces/api", "workspaces/lakehouse"]
