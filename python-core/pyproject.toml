[project]
name = "pep"
version = "0.0.1"
description = "Personal financial environment for more effective risk management in order to make optimal decisions in the face of uncertainty."
readme = "README.md"
license = { file = "LICENSE" }
dependencies = [
    "pep-pipelines",
    "pep-stock-duration",
    "pep-api",
    "pep-lakehouse",
]
requires-python = ">=3.10,<4.0"

[project.urls]
source = "https://github.com/e183b796621afbf902067460/pep"
issues = "https://github.com/e183b796621afbf902067460/pep/issues"

[dependency-groups]  # Sorted alphabetically
api-developing = ["fastapi==0.111.0", "httpx[http2]>=0.28.1,<0.29", "uvicorn>=0.34.0,<0.35", "uvloop>=0.21.0,<0.22",]
backtesting = ["backtesting>=0.6.5,<0.7", "ta-lib>=0.6.8",]
data-handling = ["duckdb>=1.4.1,<2",]
data-transformating = ["pandas>=2.2.3,<3", "polars==1.31.0", "pyarrow>=22.0.0,<23",]
data-validating = ["attrs>=25.1.0,<26", "pydantic>=2.10.6,<3", "pydantic-settings>=2.7.1,<3",]
data-plotting = ["matplotlib>=3.10.3,<4",]
feature-engineering = ["collinearity>=0.6.1,<0.7",]
hyperparameter-tuning = ["cmaes>=0.12.0,<0.13", "optuna>=4.4.0,<5",]
logging = ["loguru>=0.7.3,<0.8",]
machine-learning = ["catboost>=1.2.8,<2",]
math = ["scipy>=1.15.3,<2",]
testing = ["pytest-asyncio>=0.18.0",]
sdk = ["boto3>=1.40.50,<2",]

[tool.uv]
default-groups = "all"
package = false

# https://docs.astral.sh/uv/concepts/projects/workspaces/#workspace-sources
[tool.uv.sources]
pep-pipelines = { path = "pipelines", editable = true }
pep-stock-duration = { path = "strategies/stock-duration", editable = true }
pep-api = { workspace = true }
pep-lakehouse = { workspace = true }

[tool.uv.workspace]
members = [
    "workspaces/api",
    "workspaces/lakehouse"
]

[tool.ruff]
required-version = "0.14.8"
exclude = [".venv"]
line-length = 120
fix = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # https://docs.astral.sh/ruff/rules/any-type/
    "ANN401",

    # https://docs.astral.sh/ruff/rules/missing-trailing-comma/
    "COM812",

    # https://docs.astral.sh/ruff/rules/#pydocstyle-d
    "D100", "D104", "D105", "D106", "D107", "D206", "D212", "D401", "D413",

    # https://docs.astral.sh/ruff/rules/line-too-long/
    "E501",

    # https://docs.astral.sh/ruff/rules/#flake8-future-annotations-fa
    "FA",

    # https://docs.astral.sh/ruff/rules/#flake8-fixme-fix
    "FIX",

    # https://docs.astral.sh/ruff/rules/logging-f-string/
    "G004",

    # https://docs.astral.sh/ruff/rules/try-except-in-loop/
    "PERF203",

    # https://docs.astral.sh/ruff/rules/#refactor-plr
    "PLR0911", "PLR0912", "PLR0913", "PLR0915",

    # https://docs.astral.sh/ruff/rules/#ruff-specific-rules-ruf
    "RUF006",
    "RUF012",

    # https://docs.astral.sh/ruff/rules/#flake8-type-checking-tc
    "TC001", "TC002", "TC003",

    # https://docs.astral.sh/ruff/rules/missing-todo-author/
    "TD002",

    # https://docs.astral.sh/ruff/rules/raise-vanilla-args/
    "TRY003",

    # https://docs.astral.sh/ruff/rules/redundant-open-modes/
    "UP015",

    # https://docs.astral.sh/ruff/rules/tab-indentation/
    "W191"
]

[tool.ruff.lint.isort]
lines-after-imports = 2
split-on-trailing-comma = false
combine-as-imports = true
force-wrap-aliases = true

# https://docs.astral.sh/ruff/settings/#lint_isort_section-order
section-order = ["future", "standard-library", "third-party", "workspace", "first-party", "local-folder"]

# https://docs.astral.sh/ruff/settings/#lint_isort_sections
sections = { "workspace" = ["pep_api", "pep_lakehouse"] }
known-first-party = ["pep_pipelines", "pep_stock_duration"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-builtins]
ignorelist = ["id"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
indent-style = "tab"
docstring-code-format = true
skip-magic-trailing-comma = false

[tool.pyrefly]
python-interpreter-path = ".venv/bin/python3.13"
python-platform = "linux"
search-path = ["pipelines", "strategies/stock-duration", "workspaces/api", "workspaces/lakehouse"]
