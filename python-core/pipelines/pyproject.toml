[project]
name = "pep-pipelines"
dynamic = ["version", "dependencies"]
description = "..."
readme = "README.md"

requires-python = ">=3.10,<4.0"

[project.urls]
smart-lab-phor-dividends = "https://smart-lab.ru/q/phor/dividend/"

[build-system]
requires = ["hatchling", "uv-dynamic-versioning>=0.7.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
bump = true

[tool.uv]
package = false

[tool.uv.sources]
pep-api = { workspace = true }

[tool.hatch.metadata.hooks.uv-dynamic-versioning]
dependencies = [
    "pep-api=={{ version }}",
]

[tool.hatch.build.targets.wheel]
packages = ["pep_pipelines"]

[tool.hatch.build.targets.sdist]
exclude = ["tests"]
