version: "3.8"

services:

  # https://docs.openviking.ai/en/getting-started/01-introduction
  openviking:
    image: openviking/openviking:v0.4.12.6
    container_name: openviking
    command: /code/entrypoint.sh
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "openviking-entrypoint", "--healthcheck"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s

    volumes:
      - ./openviking/ov.conf:/code/ov.conf:ro
    ports:
      - "1933:1933"
    deploy:
      resources:
        reservations:
          cpus: "1"
          memory: 1024MiB
        limits:
          cpus: "2"
          memory: 2048MiB

    environment:
      ROUTER_AI_API_KEY:

      OPENVIKING_ROOT_API_KEY:
      OPENVIKING_SERVER_HOST: 0.0.0.0
      OPENVIKING_SERVER_PORT: 1933
      OPENVIKING_WITH_BOT: 0
    networks:
      - hermes-tier

  # https://hermes-agent.nousresearch.com/docs/user-guide/features/acp
  hermes:
    image: nousresearch/hermes-agent:v2026.8.13
    container_name: hermes
    command: ["sleep", "infinity"]
    restart: unless-stopped

    user: "${UID}:${GID}"
    working_dir: /code
    volumes:
      - .:/code:rw

      - ./hermes/config.yaml:/opt/data/config.yaml:ro
      - ./hermes/.no-bundled-skills:/opt/data/.no-bundled-skills:ro
    environment:
      ROUTER_AI_API_KEY:

      OPENVIKING_ENDPOINT: http://openviking:1933
      OPENVIKING_API_KEY:
      OPENVIKING_ACCOUNT: default
      OPENVIKING_USER: default
      OPENVIKING_AGENT: hermes
    depends_on:
      openviking:
        condition: service_healthy
    networks:
      - hermes-tier

networks:
  hermes-tier:
    driver: bridge
