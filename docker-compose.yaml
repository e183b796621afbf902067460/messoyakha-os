version: "3.8"

services:

  # https://docs.openviking.ai/en/getting-started/01-introduction
  # https://docs.byteplus.com/en/docs/ModelArk/2288685#ebf140a1
  openviking:
    image: openviking/openviking:v0.4.12.6
    container_name: openviking
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "openviking-entrypoint", "--healthcheck"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s

    volumes:
      - ./.openviking/ov.conf:/app/.openviking/ov.conf:ro
      - ./.openviking/resources:/resources:ro
    ports:
      - "1933:1933"
    deploy:
      resources:
        reservations:
          cpus: "1"
          memory: 1024MiB
        limits:
          cpus: "2"
          memory: 2048MiB

    environment:
      ROUTER_AI_API_KEY:

      OPENVIKING_ROOT_API_KEY: openssl rand -hex 32
      OPENVIKING_SERVER_HOST: 0.0.0.0
      OPENVIKING_SERVER_PORT: 1933
      OPENVIKING_WITH_BOT: 0
    networks:
      - hermes-tier

  # https://hermes-agent.nousresearch.com/docs/user-guide/features/acp
  hermes:
    build:
      context: .
      dockerfile: ./.hermes/Dockerfile
    container_name: hermes
    command: ["sh", "-c", "sleep infinity"]
    restart: unless-stopped

    working_dir: /code
    volumes:
      # https://hermes-agent.nousresearch.com/docs/user-guide/docker
      - ./home:/code/home:rw
      - ./lib:/code/lib:rw
      - ./pyproject.toml:/code/pyproject.toml:rw

      - ./.hermes/config.yaml:/opt/data/config.yaml:ro
      - ./.hermes/SOUL.md:/opt/data/SOUL.md:ro
      - ./.hermes/USER.md:/opt/data/memories/USER.md:ro
      - ./.hermes/.no-bundled-skills:/opt/data/.no-bundled-skills:ro

    environment:
      ROUTER_AI_API_KEY: 

      OPENVIKING_ENDPOINT: http://openviking:1933
      OPENVIKING_API_KEY: openssl rand -hex 32
      OPENVIKING_ACCOUNT: default
      OPENVIKING_USER: default
      OPENVIKING_AGENT: hermes

      HERMES_UID: ${UID:-10000}
      HERMES_GID: ${GID:-10000}
    depends_on:
      openviking:
        condition: service_healthy
    networks:
      - hermes-tier

networks:
  hermes-tier:
    driver: bridge
